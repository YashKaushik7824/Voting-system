<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="../css/stylesheet.css">
</head>

<body>
    <style>
        .headerSection{
            font-size: x-large;
        }
        .bodySection{
            font-size: x-large;
        }
        #address{
            width: 28%;
        }
        .per13{
            width: 13%;
        }
        input{
            padding: 10px;
            border-radius: 5px;
        }
        #imagepart{
            border: 2px solid black;
            border-radius: 5px;
            width: 29%;
            padding: 10px;
        }
        #role{
            border: 2px solid black;
            border-radius: 5px;
            width: 29%;
            padding: 10px;
        }
        #role select{
            padding: 7px;
            border-radius: 5px;
            width: 25%;
        }
        .submit{
            padding: 10px;
            border-radius: 5px;
            background-color: rgb(0, 132, 255);
            
        }
    </style>
    <header>
        <div class="logo">
            <img src="../images/logp.jpeg">
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="feedback.html">Feedback</a></li>

            </ul>
        </nav>
    </header>
    <center>

        <div class="headerSection">
            <h1>Online Voting System</h1>
        </div><hr>
        <div class="bodySection">
            <h3>Registration</h3>
            <form action="../api/register.php" method="post" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="Enter Name" class="per13">
                <input type="number" name="mobile" placeholder="Enter mobile" class="per13"><br><br>
                <input type="password" name="password" placeholder="Enter password" class="per13">
                <input type="password" name="cpassword" placeholder="Confirm password" class="per13"><br><br>
                <input id="address" type="text" name="address" placeholder="Address"><br><br>
                <div id="imagepart">
                    Upload image: <input type="file" name="photo">
                </div>
                <br>
                <div id="role">

                    Select your role: <select name="role">
                        <option value="1">Voter</option>
                        <option value="2">Group</option>
                    </select>
                </div><br>
                <button type="submit" class="submit">Register</button><br><br>
                Already a user ? <a href="">Login here</a>
            </form>
        </div>
    </center>
    <footer>
        <p class="flex-all-center">
            Copyright &copy; V-vote
        </p>
    </footer>

</body>

</html>
